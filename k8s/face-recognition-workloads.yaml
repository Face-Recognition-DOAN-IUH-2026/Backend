apiVersion: apps/v1
kind: Deployment
metadata:
  name: face-recognition-api
  labels:
    app.kubernetes.io/name: face-recognition
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: face-recognition
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: face-recognition
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: face-recognition:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: face-recognition-config
            - secretRef:
                name: face-recognition-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: face-recognition-worker
  labels:
    app.kubernetes.io/name: face-recognition
    app.kubernetes.io/component: worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: face-recognition
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: face-recognition
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: face-recognition:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info", "--concurrency=2", "--include=worker.tasks"]
          envFrom:
            - configMapRef:
                name: face-recognition-config
            - secretRef:
                name: face-recognition-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
