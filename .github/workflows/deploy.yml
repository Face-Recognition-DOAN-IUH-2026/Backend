name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
      - 11-11-26
      - 07-11-26
      - 18-10-26
  pull_request:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  test:
    name: 🧪 Automated Quality Gate & Unit Testing
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_SECRET: test-jwt-access-secret-for-ci-testing-purposes-12345
      JWT_ACCESS_SECRET: test-jwt-access-secret-for-ci-testing-purposes-12345
      SERVICE_JWT_SECRET: test-service-jwt-secret-for-ci-testing-purposes-12345

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            shared/package.json
            ai-service/package.json
            api-gateway/package.json

      - name: 📦 Build Shared Library (@library/shared)
        run: |
          echo "== Building shared library =="
          cd shared
          npm ci || npm install
          npm run build
          cd ..

      - name: 🧪 Run AI Service Unit Tests (130+ tests)
        run: |
          echo "== Testing ai-service =="
          cd ai-service
          npm ci || npm install
          npm test -- --ci --maxWorkers=2
          echo "== Compiling TypeScript for ai-service =="
          npm run build
          cd ..

      - name: 🔍 Build & Validate API Gateway
        run: |
          echo "== Validating and compiling api-gateway =="
          cd api-gateway
          npm ci || npm install
          npm run build
          cd ..

  deploy:
    name: 🚀 Deploy Microservices to AWS EC2
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: SSH to EC2 and Trigger Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 600s
          script_stop: true
          script: |
            echo "== 🚀 Bắt đầu cập nhật Backend trên AWS EC2 =="
            cd /opt/iuh-backend

            echo "== 0/4 Cấp quyền sở hữu thư mục git cho $(whoami) =="
            sudo chown -R $(whoami):$(whoami) /opt/iuh-backend
            sudo chmod -R u+rwX /opt/iuh-backend/.git
            git config --global --add safe.directory /opt/iuh-backend

            echo "== 1/4 Cập nhật mã nguồn git (${{ github.ref_name }}) =="
            git fetch origin "${{ github.ref_name }}"
            git checkout "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            echo "HEAD: $(git log -1 --oneline)"

            echo "== 2/4 Khởi động và cập nhật container =="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans

            echo "== 3/4 Dọn dẹp images cũ =="
            docker image prune -f

            echo "== 4/4 Trạng thái các services =="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps

            echo "== ✅ Hoàn tất cập nhật Backend! =="
