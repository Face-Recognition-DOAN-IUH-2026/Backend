global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "face-recognition-api"
    metrics_path: "/health"
    static_configs:
      - targets: ["face-recognition-api:8000"]

  - job_name: "api-gateway"
    metrics_path: "/health"
    static_configs:
      - targets: ["gateway:80"]
