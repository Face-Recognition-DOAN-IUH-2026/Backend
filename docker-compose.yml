services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: face_recognition
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./borrow-service/init.sql:/docker-entrypoint-initdb.d/02-borrowdb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - face-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - face-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - face-network

  milvus:
    image: milvusdb/milvus:v2.4.0
    restart: unless-stopped
    volumes:
      - milvusdata:/var/lib/milvus
    command: [/milvus/bin/milvus, run, standalone]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
      COMMON_GRACETIMELENGTH: 120000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - face-network

  face-recognition-api:
    build:
      context: face-recognition-service
      dockerfile: Dockerfile.api
    container_name: face-recognition-api
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - insightface_models:/root/.insightface/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: face-recognition-service
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    shm_size: "2gb"
    deploy:
      replicas: 3
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info", "--concurrency=2", "--include=worker.tasks"]
    env_file:
      - ./.env
    volumes:
      - insightface_models:/root/.insightface/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - face-network

  user-service:
    build:
      context: user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3001
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - face-network

  schedule-service:
    build:
      context: schedule-service
      dockerfile: Dockerfile
    container_name: schedule-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_NAME: face_recognition
      DB_SCHEMA: schedule
      USER_SERVICE_URL: http://user-service:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  access-service:
    build:
      context: access-service
      dockerfile: Dockerfile
    container_name: access-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_NAME: face_recognition
      DB_SCHEMA: access
      USER_SERVICE_URL: http://user-service:3001
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "80:80"
    env_file:
      - ./.env
    environment:
      PORT: 80
      SCHEDULE_SERVICE: http://schedule-service:3002
      ACCESS_SERVICE: http://access-service:3003
    depends_on:
      - face-recognition-api
      - user-service
      - borrow-service
      - schedule-service
      - access-service
    networks:
      - face-network
    restart: unless-stopped

  borrow-service:
    build:
      context: borrow-service
      dockerfile: Dockerfile
    container_name: borrow-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/borrowdb
      USER_SERVICE_URL: http://user-service:3001
      ACCESS_SERVICE_URL: http://access-service:3003
      FACE_RECOGNITION_API: http://face-recognition-api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-borrow-internal-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      access-service:
        condition: service_started
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  miniodata:
  milvusdata:
  insightface_models:

networks:
  face-network:
    name: face-network
    driver: bridge
