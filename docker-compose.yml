services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-face_recognition}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Backend/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-service-databases.sql:/docker-entrypoint-initdb.d/01-create-service-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - face-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - face-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in Backend/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Set RABBITMQ_PASS in Backend/.env}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - face-network

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in Backend/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in Backend/.env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - face-network

  milvus:
    image: milvusdb/milvus:v2.4.0
    restart: unless-stopped
    volumes:
      - milvusdata:/var/lib/milvus
    command: [/milvus/bin/milvus, run, standalone]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
      COMMON_GRACETIMELENGTH: 120000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - face-network

  face-recognition-migrate:
    build:
      context: face-recognition-service
      dockerfile: Dockerfile.api
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file:
      - ./.env
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL in Backend/.env}
      POSTGRES_DB: facedb
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - face-network

  face-recognition-api:
    build:
      context: face-recognition-service
      dockerfile: Dockerfile.api
    container_name: face-recognition-api
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL in Backend/.env}
      POSTGRES_DB: facedb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./face-recognition-service:/app
      - insightface_models:/root/.insightface/models
    depends_on:
      postgres:
        condition: service_healthy
      face-recognition-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: face-recognition-service
      dockerfile: Dockerfile.worker
    container_name: face-recognition-worker
    restart: unless-stopped
    shm_size: "1gb"
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info", "--concurrency=1", "--include=worker.tasks"]
    env_file:
      - ./.env
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?Set POSTGRES_URL in Backend/.env}
      POSTGRES_DB: facedb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./face-recognition-service:/app
      - insightface_models:/root/.insightface/models
    depends_on:
      postgres:
        condition: service_healthy
      face-recognition-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app inspect ping --timeout=5 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_NAME: userdb
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  schedule-service:
    build:
      context: .
      dockerfile: schedule-service/Dockerfile
    container_name: schedule-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_NAME: scheduledb
      DB_SCHEMA: schedule
      USER_SERVICE_URL: http://user-service:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in Backend/.env}
      TZ: Asia/Ho_Chi_Minh
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  access-service:
    build:
      context: .
      dockerfile: access-service/Dockerfile
    container_name: access-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_NAME: accessdb
      DB_SCHEMA: access
      USER_SERVICE_URL: http://user-service:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in Backend/.env}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chromadbdata:/chroma/chroma/chroma_data
    environment:
      IS_PERSISTENT: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - face-network

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: ai-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_NAME: aidb
      DB_SCHEMA: ai
      ACCESS_SERVICE_URL: http://access-service:3003
      BORROW_SERVICE_URL: http://borrow-service:8000
      SCHEDULE_SERVICE_URL: http://schedule-service:3002
      USER_SERVICE_URL: http://user-service:3001
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in Backend/.env}
      JWT_SECRET: ${JWT_SECRET}
      AI_MOCK_MODE: ${AI_MOCK_MODE:-true}
      AI_REFRESH_MINUTES: ${AI_REFRESH_MINUTES:-15}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-20b}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-meta/llama-3.1-70b-instruct}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-70b-instruct}
      NVIDIA_EMBED_MODEL: ${NVIDIA_EMBED_MODEL:-nvidia/nv-embedqa-e5-v5}
      CHROMA_DB_URL: http://chromadb:8000
      CHROMA_COLLECTION: library-kb
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      access-service:
        condition: service_started
      borrow-service:
        condition: service_started
      schedule-service:
        condition: service_started
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3006
      DB_HOST: postgres
      DB_NAME: notificationdb
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in Backend/.env}
      JWT_ISSUER: ${JWT_ISSUER:-face-recognition}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-face-recognition-users}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in Backend/.env}
      # Khai báo tường minh để Compose interpolate đúng thay vì env_file truyền literal string
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Set RABBITMQ_USER in Backend/.env}:${RABBITMQ_PASS:?Set RABBITMQ_PASS in Backend/.env}@rabbitmq:5672
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3006/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  automation-service:
    build:
      context: .
      dockerfile: automation-service/Dockerfile
    container_name: automation-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3007
      DB_HOST: postgres
      DB_NAME: automationdb
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in Backend/.env}
      JWT_ISSUER: ${JWT_ISSUER:-face-recognition}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-face-recognition-users}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in Backend/.env}
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      BORROW_SERVICE_URL: http://borrow-service:8000
      SCHEDULE_SERVICE_URL: http://schedule-service:3002
      ACCESS_SERVICE_URL: http://access-service:3003
      USER_SERVICE_URL: http://user-service:3001
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      notification-service:
        condition: service_started
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3007/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      # Dev (mặc định): publish 0.0.0.0:80 như cũ.
      # Prod: set GATEWAY_HOST_IP=127.0.0.1 và GATEWAY_PORT=8080 để chỉ Caddy public ra ngoài (xem docker-compose.prod.yml).
      - "${GATEWAY_HOST_IP:-0.0.0.0}:${GATEWAY_PORT:-80}:80"
    env_file:
      - ./.env
    environment:
      PORT: 80
      SCHEDULE_SERVICE: http://schedule-service:3002
      ACCESS_SERVICE: http://access-service:3003
      AI_SERVICE: http://ai-service:3004
      NOTIFICATION_SERVICE: http://notification-service:3006
      AUTOMATION_SERVICE: http://automation-service:3007
    depends_on:
      - face-recognition-api
      - user-service
      - borrow-service
      - schedule-service
      - access-service
      - ai-service
      - notification-service
      - automation-service
      - chromadb
    networks:
      - face-network
    restart: unless-stopped

  borrow-service:
    build:
      context: .
      dockerfile: borrow-service/Dockerfile
    container_name: borrow-service
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_URL: ${BORROW_POSTGRES_URL:?Set BORROW_POSTGRES_URL in Backend/.env}
      USER_SERVICE_URL: http://user-service:3001
      ACCESS_SERVICE_URL: http://access-service:3003
      FACE_RECOGNITION_API: http://face-recognition-api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in Backend/.env}
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
      access-service:
        condition: service_healthy
    networks:
      - face-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  pgdata:
  miniodata:
  milvusdata:
  chromadbdata:
  insightface_models:

networks:
  face-network:
    name: face-network
    driver: bridge
